[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-tracer-pkt-format"
version = "0.4.1"
description = "Read, write and generate Cisco Packet Tracer .pkt/.pka files offline: byte-exact codec, typed models, and a reverse-engineering reference"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "aacanadaa" }]
keywords = [
  "packet-tracer",
  "cisco",
  "pkt",
  "pka",
  "file-format",
  "twofish",
  "eax",
  "reverse-engineering",
  "networking",
  "ccna",
  "lab-generator",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "hypothesis>=6.90",
  "build>=1.0.0",
  "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/aacanadaa/packet-tracer-pkt-format"
Repository = "https://github.com/aacanadaa/packet-tracer-pkt-format"
Issues = "https://github.com/aacanadaa/packet-tracer-pkt-format/issues"
Documentation = "https://aacanadaa.github.io/packet-tracer-pkt-format/"
Changelog = "https://github.com/aacanadaa/packet-tracer-pkt-format/releases"
Format-Specification = "https://github.com/aacanadaa/packet-tracer-pkt-format/blob/main/docs/FORMAT_SPECIFICATION.md"
Verification-Report = "https://github.com/aacanadaa/packet-tracer-pkt-format/blob/main/docs/CORPUS_VERIFICATION.md"

[project.scripts]
pkt = "pkt_core.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pkt_core" = ["py.typed"]
"pkt_core.data" = ["*.json", "*.xml"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true
# typings/ carries the stub for the optional Rust accelerator module
# pkt_core_native, so mypy --strict stays clean whether or not the extension
# is installed in the environment running the check.
mypy_path = "typings"

[[tool.mypy.overrides]]
# The authoring module is a port of tools/lab_api.py, which was written and
# verified against Packet Tracer before the package had a strict-typing gate.
# Its public signatures are annotated, but the bodies are ElementTree surgery
# with Optional-returning lookups throughout, and annotating a thousand lines of
# it in the same change as the port would put byte-exact behaviour at risk for no
# user-visible gain. The relaxation is deliberate, scoped to this one module, and
# tracked in BUILDER_PORT.md; every other module stays fully under --strict.
module = "pkt_core.builder.*"
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["pkt_core"]
# The 90% bar was set for the codec and the models. pkt_core.builder is a port of
# the authoring code and sits at 67% — it is exercised heavily by test_lab_api,
# test_layout and test_power, but not to the standard the rest of the package is
# held to. It is left out of the aggregate so that adding it could not be used to
# quietly lower the bar for everything else; the real number is reported, and
# closing the gap is tracked in BUILDER_PORT.md.
omit = ["*/pkt_core/builder/*"]

[tool.coverage.report]
# The brief sets the bar at 90% on codec and models; the project currently
# sits at 96% overall. Enforced so regressions cannot land unnoticed.
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not corpus'"
markers = [
  "corpus: whole-corpus acceptance tests (slow; opt in with -m corpus)",
]
